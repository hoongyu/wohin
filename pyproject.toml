[project]
name = "wohin"
version = "0.1.0"
description = "Wohin: photo-based waste sorting assistant for Berlin (Neural Storm 2026, GP-05)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "streamlit>=1.38",
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

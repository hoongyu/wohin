# Common items for text search (DE and EN names).
# material: one of the 8 classes; answers: preset answers to the follow-up questions.
# verified: false -> our sources (docs/cloud-task.md, appendix A) do not cover this item;
#   the app links to the BSR A-Z and only shows the `hint`, which repeats verified facts.
